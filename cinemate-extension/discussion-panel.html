<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineMate</title>
<link rel="stylesheet" href="styles/panel.css" />
</head>

<body>
<div class="frame">
  <div class="header">
    <div class="thumb">🎬</div>
    <div class="header-text">
      <div class="title">CineMate</div>
      <div id="videoTitle" class="video-title">No video detected</div>
      <div id="status" class="status">Ready</div>
    </div>
    <div class="header-actions">
      <button id="clearCaptionsBtn" class="icon-btn" title="Clear captured captions for this video">🧹</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </div>
  </div>

  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span>
    <button id="bannerAction" class="banner-btn" hidden></button>
  </div>

  <div class="persona-row">
    <button class="persona-pill" data-personality="filmCritic">🎬 Critic</button>
    <button class="persona-pill active" data-personality="casualFriend">😊 Friend</button>
    <button class="persona-pill" data-personality="theoryAnalyst">🕵️ Theorist</button>
  </div>

  <div id="conversation" class="chat">
    <div class="ai">Ask me about the scene, character choices, conflicts, or what just happened.</div>
  </div>

  <div id="summaryPanel" class="summary-panel">
    <div id="summaryNotice" class="coverage-note" hidden></div>

    <div id="spoilerGate" class="summary-card spoiler-gate" hidden>
      <b>Saved summary runs ahead</b>
      <span id="spoilerGateText"></span>
      <button id="revealSummaryBtn" class="summary-btn secondary">Show it anyway</button>
    </div>

    <div id="summaryContent">
      <div class="summary-card">
        <b>Episode Memory</b>
        <span id="summaryText">Generate a summary from captured subtitles.</span>
      </div>
      <div class="summary-card">
        <b>Key Themes</b>
        <div id="themeChips" class="chips"></div>
      </div>
      <div class="summary-card">
        <b>Important Events</b>
        <div id="eventsList">No events generated yet.</div>
      </div>
    </div>

    <div class="summary-actions">
      <button id="saveNotesBtn" class="summary-btn">Save Notes</button>
      <button id="newChatBtn" class="summary-btn secondary">New Chat</button>
    </div>
  </div>

  <div id="sessionsPanel" class="sessions-panel">
    <div id="sessionsList"></div>
  </div>

  <div class="actions">
    <button class="action" data-message="Explain this scene.">Explain scene</button>
    <button class="action" data-message="What is the main conflict right now?">Main conflict</button>
    <button id="summaryBtn" class="action">Generate summary</button>
  </div>

  <div class="composer">
    <form id="textForm" class="text-form">
      <input id="textInput" type="text" maxlength="1000" autocomplete="off" placeholder="Ask about this scene…" />
      <button id="sendBtn" class="send-btn" type="submit" title="Send">➤</button>
    </form>
    <button id="talkBtn" class="mic" title="Talk to CineMate">🎙</button>
    <button id="stopBtn" class="stop-btn" title="Stop (Esc)" hidden>■</button>
  </div>
  <div id="voiceHint" class="hint">Type a question or tap 🎙 to talk · Esc stops</div>

  <div class="nav">
    <button id="chatTab" class="active">Chat</button>
    <button id="summaryTab">Summary</button>
    <button id="sessionsTab">Sessions</button>
  </div>
</div>

<script src="utils/timestamps.js"></script>
<script src="utils/storage.js"></script>
<script src="utils/context.js"></script>
<script src="utils/api.js"></script>
<script src="platforms/registry.js"></script>
<script src="platforms/youtube.js"></script>
<script src="platforms/netflix.js"></script>
<script src="platforms/primevideo.js"></script>
<script src="utils/sessions.js"></script>
<script src="utils/status.js"></script>
<script src="utils/speech.js"></script>
<script src="utils/listen.js"></script>
<script src="panel.js"></script>
</body>
</html>
