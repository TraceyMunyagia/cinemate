<!DOCTYPE html>
<html>
<head>
<title>CineMate</title>
<style>
body {
  margin: 0;
  background: #050507;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Inter, Arial, sans-serif;
}

.frame {
  width: 360px;
  height: 640px;
  background: #0B0B0F;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  color: white;
  overflow: hidden;
}

.header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #1F2937;
}

.thumb {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: linear-gradient(135deg, #7C3AED, #111827);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.title {
  font-size: 14px;
  font-weight: 700;
}

.status {
  font-size: 12px;
  color: #A1A1AA;
  min-height: 16px;
}

.chat {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.ai,
.user {
  padding: 12px;
  border-radius: 16px;
  max-width: 260px;
  font-size: 13px;
  line-height: 1.35;
}

.ai {
  background: #111827;
}

.user {
  background: #7C3AED;
  margin-left: auto;
}

.summary-panel {
  flex: 1;
  display: none;
  overflow-y: auto;
  padding: 16px;
}

.summary-panel.active {
  display: block;
}

.summary-card {
  background: #111827;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.4;
}

.summary-card b {
  display: block;
  margin-bottom: 8px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 6px 8px;
  border-radius: 8px;
  background: rgba(124, 58, 237, 0.22);
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
}

.action {
  padding: 7px 10px;
  background: #111827;
  border: 1px solid #1F2937;
  color: white;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
}

.voice {
  text-align: center;
  padding: 14px 16px 16px;
  border-top: 1px solid #1F2937;
}

.mic {
  width: 70px;
  height: 70px;
  background: #7C3AED;
  border: 0;
  border-radius: 50%;
  margin: 0 auto 10px;
  box-shadow: 0 0 30px rgba(124, 58, 237, 0.7);
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.mic.recording {
  background: #DC2626;
  box-shadow: 0 0 30px rgba(220, 38, 38, 0.7);
}

.hint {
  color: #A1A1AA;
  font-size: 12px;
}

.nav {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-top: 1px solid #222;
}

.nav button {
  border: 0;
  background: transparent;
  color: #A1A1AA;
  font-size: 12px;
  cursor: pointer;
}

.nav button.active {
  color: white;
}
</style>
</head>

<body>
<div class="frame">
  <div class="header">
    <div class="thumb">🎬</div>
    <div>
      <div class="title">CineMate</div>
      <div id="status" class="status">Ready</div>
    </div>
  </div>

  <div id="conversation" class="chat">
    <div class="ai">Ask me about the scene, character choices, conflicts, or what just happened.</div>
  </div>

  <div id="summaryPanel" class="summary-panel">
    <div class="summary-card">
      <b>Episode Memory</b>
      <span id="summaryText">Generate a summary from captured subtitles.</span>
    </div>
    <div class="summary-card">
      <b>Key Themes</b>
      <div id="themeChips" class="chips"></div>
    </div>
    <div class="summary-card">
      <b>Important Events</b>
      <div id="eventsList">No events generated yet.</div>
    </div>
  </div>

  <div class="actions">
    <button class="action" data-message="Explain this scene.">Explain scene</button>
    <button class="action" data-message="What is the main conflict right now?">Main conflict</button>
    <button id="summaryBtn" class="action">Generate summary</button>
  </div>

  <div class="voice">
    <button id="talkBtn" class="mic" title="Start or stop recording">🎙</button>
    <div id="voiceHint" class="hint">Tap to speak</div>
  </div>

  <div class="nav">
    <button id="chatTab" class="active">Chat</button>
    <button id="summaryTab">Summary</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
