<!DOCTYPE html>
<html>
<head>
<title>CineMate</title>
<style>
body {
  margin: 0;
  background: #050507;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Inter, Arial, sans-serif;
}

.frame {
  width: 360px;
  height: 640px;
  background: #0B0B0F;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  color: white;
  overflow: hidden;
}

.header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #1F2937;
}

.thumb {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: linear-gradient(135deg, #7C3AED, #111827);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.title {
  font-size: 14px;
  font-weight: 700;
}

.status {
  font-size: 12px;
  color: #A1A1AA;
  min-height: 16px;
}
.header-text {
  flex: 1;
  min-width: 0;
}

.video-title {
  font-size: 12px;
  color: #C4B5FD;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid #1F2937;
  background: #111827;
  color: #A1A1AA;
  cursor: pointer;
}

.icon-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.persona-row {
  display: flex;
  gap: 6px;
  padding: 10px 16px 0;
}

.persona-pill {
  flex: 1;
  padding: 6px 4px;
  border-radius: 999px;
  border: 1px solid #1F2937;
  background: #111827;
  color: #A1A1AA;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.persona-pill.active {
  background: rgba(124, 58, 237, 0.25);
  border-color: #7C3AED;
  color: white;
}

.chat {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.ai,
.user {
  padding: 12px;
  border-radius: 16px;
  max-width: 260px;
  font-size: 13px;
  line-height: 1.35;
}

.ai {
  background: #111827;
}

.user {
  background: #7C3AED;
  margin-left: auto;
}

.thinking {
  background: #111827;
  display: flex;
  align-items: center;
  gap: 8px;
}

.thinking .dots {
  display: flex;
  gap: 4px;
}

.thinking .dot {
  width: 6px;
  height: 6px;
  background: #A78BFA;
  border-radius: 50%;
  animation: blink 1.4s infinite;
}

.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.thinking .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.summary-panel {
  flex: 1;
  display: none;
  overflow-y: auto;
  padding: 16px;
}

.summary-panel.active {
  display: block;
}

.summary-card {
  background: #111827;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.4;
}

.summary-card b {
  display: block;
  margin-bottom: 8px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 6px 8px;
  border-radius: 8px;
  background: rgba(124, 58, 237, 0.22);
  font-size: 12px;
}

.summary-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.summary-btn {
  flex: 1;
  padding: 10px;
  border: 0;
  border-radius: 12px;
  text-align: center;
  background: #7C3AED;
  color: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.summary-btn.secondary {
  background: #111827;
  border: 1px solid #1F2937;
}

.actions {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
}

.action {
  padding: 7px 10px;
  background: #111827;
  border: 1px solid #1F2937;
  color: white;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
}

.voice {
  text-align: center;
  padding: 14px 16px 16px;
  border-top: 1px solid #1F2937;
}

.mic {
  width: 70px;
  height: 70px;
  background: #7C3AED;
  border: 0;
  border-radius: 50%;
  margin: 0 auto 10px;
  box-shadow: 0 0 30px rgba(124, 58, 237, 0.7);
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.mic.recording {
  background: #DC2626;
  animation: micPulse 1.4s infinite;
}

@keyframes micPulse {
  0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
  70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
  100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
}

.hint {
  color: #A1A1AA;
  font-size: 12px;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.spinner {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-top-color: white;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.nav {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-top: 1px solid #222;
}

.nav button {
  border: 0;
  background: transparent;
  color: #A1A1AA;
  font-size: 12px;
  cursor: pointer;
}

.nav button.active {
  color: white;
}
</style>
</head>

<body>
<div class="frame">
  <div class="header">
    <div class="thumb">🎬</div>
       <div class="header-text">
      <div class="title">CineMate</div>
      <div id="videoTitle" class="video-title">No video detected</div>
      <div id="status" class="status">Ready</div>
    </div>
    <button id="clearCaptionsBtn" class="icon-btn" title="Clear captured captions for this video">🧹</button>
  </div>
  </div>

  <div class="persona-row">
    <button class="persona-pill" data-personality="filmCritic">🎬 Critic</button>
    <button class="persona-pill active" data-personality="casualFriend">😊 Friend</button>
    <button class="persona-pill" data-personality="theoryAnalyst">🕵️ Theorist</button>
  </div>

  <div id="conversation" class="chat">
    <div class="ai">Ask me about the scene, character choices, conflicts, or what just happened.</div>
  </div>

  <div id="summaryPanel" class="summary-panel">
    <div class="summary-card">
      <b>Episode Memory</b>
      <span id="summaryText">Generate a summary from captured subtitles.</span>
    </div>
    <div class="summary-card">
      <b>Key Themes</b>
      <div id="themeChips" class="chips"></div>
    </div>
    <div class="summary-card">
      <b>Important Events</b>
      <div id="eventsList">No events generated yet.</div>
    </div>

    <div class="summary-actions">
      <button id="saveNotesBtn" class="summary-btn">Save Notes</button>
      <button id="newChatBtn" class="summary-btn secondary">New Chat</button>
    </div>
  </div>

  <div class="actions">
    <button class="action" data-message="Explain this scene.">Explain scene</button>
    <button class="action" data-message="What is the main conflict right now?">Main conflict</button>
    <button id="summaryBtn" class="action">Generate summary</button>
  </div>

  <div class="voice">
    <button id="talkBtn" class="mic" title="Start or stop recording">🎙</button>
    <div id="voiceHint" class="hint">Tap to speak</div>
  </div>

  <div class="nav">
    <button id="chatTab" class="active">Chat</button>
    <button id="summaryTab">Summary</button>
  </div>
</div>

<script src="utils/storage.js"></script>
<script src="utils/context.js"></script>
<script src="popup.js"></script></body>
</html>
