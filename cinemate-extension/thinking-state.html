<!DOCTYPE html>
<html>
<head>
<title>Thinking</title>
<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Inter;
}

.frame {
  width: 360px;
  height: 640px;
  background: #0B0B0F;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

.ring {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid rgba(124,58,237,0.3);
  display: flex;
  justify-content: center;
  align-items: center;
}

.dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 8px;
  height: 8px;
  background: #A78BFA;
  border-radius: 50%;
  animation: blink 1.4s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes blink {
  0%,100% {opacity:0.3;}
  50% {opacity:1;}
}
</style>
</head>

<body>

<div class="frame">
  <div class="ring">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div style="margin-top:20px;">CineMate is thinking...</div>
</div>

</body>
</html>
