<!DOCTYPE html>
<html>
<head>
<title>Summary</title>
<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Inter;
}

.frame {
  width: 360px;
  height: 640px;
  background: #0B0B0F;
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  color: white;
}

/* Cards */
.card {
  background: #111827;
  padding: 16px;
  border-radius: 16px;
}

/* Chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 6px 10px;
  background: rgba(124,58,237,0.2);
  border-radius: 12px;
  font-size: 11px;
}

/* Buttons */
.buttons {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
  background: #7C3AED;
}
</style>
</head>

<body>

<div class="frame">

  <div class="card">
    <b>Episode Summary</b>
    <p style="color:#A1A1AA;">
      The episode explores trust, betrayal, and shifting alliances.
    </p>
  </div>

  <div class="card">
    <b>Key Themes</b>
    <div class="chips">
      <div class="chip">Betrayal</div>
      <div class="chip">Power</div>
      <div class="chip">Family</div>
    </div>
  </div>

  <div class="card">
    <b>Key Moments</b>
    <ul style="color:#A1A1AA;">
      <li>Major betrayal</li>
      <li>Alliance broken</li>
    </ul>
  </div>

  <div class="buttons">
    <div class="btn">Save Notes</div>
    <div class="btn">New Chat</div>
  </div>

</div>

</body>
</html>
